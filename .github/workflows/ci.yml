name: CI

# The gates (backlog/docs/commands.md), on a GitHub-hosted x86-64 Ubuntu
# runner, on every push to main, on pull requests and on manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  publication:
    name: publication guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Publication guard
        run: scripts/publication-guard.sh

  test:
    name: test (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_version: "2.29.2"
          github_access_token: ""
          enable_kvm: false

      - name: Dev shell
        id: devshell
        run: nix develop --no-update-lock-file --command rustc --version

      # The oracle corpora of scripts/oracles.manifest (decision-3), cached by
      # the manifest's hash and the sets fetched; fetch downloads only what is missing or wrong and
      # checks every file's pin. The cache is saved right after a good fetch,
      # so a red gate later in the job does not throw it away.
      - name: Oracle cache
        id: oracle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracles
          key: oracles-${{ hashFiles('scripts/oracles.manifest') }}-sst-nes6502-nestest

      - name: Oracles
        id: oracles
        run: scripts/fetch-oracles.sh fetch sst-nes6502 nestest

      - name: Save oracle cache
        if: ${{ steps.oracles.outcome == 'success' && steps.oracle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracles
          key: oracles-${{ hashFiles('scripts/oracles.manifest') }}-sst-nes6502-nestest

      # Every gate below runs even after an earlier failure, and any failed
      # gate fails the job. pre-commit and gpg-uid-guard stay local.
      - name: Formatting
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop --no-update-lock-file --command cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop --no-update-lock-file --command cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' && steps.oracles.outcome == 'success' }}
        env:
          X65_SST_REQUIRED: "1"
          NES_ORACLES_REQUIRED: "1"
        run: nix develop --no-update-lock-file --command cargo nextest run --workspace --all-features --locked --no-fail-fast

      - name: Doctests
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop --no-update-lock-file --command cargo test --workspace --doc --all-features --locked

      - name: Licences (cargo-deny)
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop --no-update-lock-file --command cargo deny --all-features check licenses bans sources
